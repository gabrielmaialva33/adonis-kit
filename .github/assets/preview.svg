<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1100 580"
  width="1100"
  height="580"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">A tenant-scoped REST API request</title>
  <desc id="description">
    Illustrative GET /api/v1/files request with Bearer JWT and X-Tenant-Id 7. The response excerpt
    shows a private file download URL. Authentication, membership and permissions are checked before
    the tenant-scoped query.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020" />
      <stop offset="1" stop-color="#151036" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5a45ff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035" />
    </pattern>
  </defs>
  <rect x="12" y="12" width="1076" height="556" rx="18" fill="url(#background)" stroke="#334155" />
  <rect x="12" y="12" width="1076" height="556" rx="18" fill="url(#grid)" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="40" cy="40" r="5" fill="#f87171" />
    <circle cx="60" cy="40" r="5" fill="#fbbf24" />
    <circle cx="80" cy="40" r="5" fill="#34d399" />
    <text x="550" y="45" text-anchor="middle" fill="#94a3b8" font-size="13">
      adonis-kit / API exchange
    </text>
    <text x="44" y="96" fill="#f8fafc" font-size="25" font-weight="700">
      One request. One verified workspace.
    </text>
    <text x="44" y="124" fill="#94a3b8" font-size="14">
      Your client sends the context. The API verifies access.
    </text>
    <rect
      x="44"
      y="151"
      width="490"
      height="285"
      rx="12"
      fill="#0f172a"
      stroke="#8b7bff"
      stroke-opacity="0.6"
    />
    <rect
      x="558"
      y="151"
      width="498"
      height="285"
      rx="12"
      fill="#0f172a"
      stroke="#22d3ee"
      stroke-opacity="0.6"
    />
    <text x="64" y="181" fill="#c4bbff" font-size="12" letter-spacing="2">REQUEST</text>
    <text x="578" y="181" fill="#a5f3fc" font-size="12" letter-spacing="2">
      RESPONSE · JSON EXCERPT
    </text>
    <path d="M64 197H514M578 197H1036" stroke="#334155" />
    <g font-size="14">
      <text x="64" y="229" fill="#e2e8f0">
        <tspan fill="#34d399">GET</tspan>
        /api/v1/files?per_page=20 HTTP/1.1
      </text>
      <text x="64" y="259" fill="#94a3b8">
        Accept:
        <tspan fill="#e2e8f0">application/json</tspan>
      </text>
      <text x="64" y="289" fill="#94a3b8">
        Authorization:
        <tspan fill="#c4bbff">Bearer &lt;access_token&gt;</tspan>
      </text>
      <text x="64" y="319" fill="#94a3b8">
        X-Tenant-Id:
        <tspan fill="#fbcfe8">7</tspan>
      </text>
      <text x="64" y="394" fill="#64748b" font-size="12">
        Requires active membership + files.list
      </text>
      <text x="578" y="229" fill="#34d399">HTTP/1.1 200 OK</text>
      <text x="578" y="257" fill="#94a3b8">Content-Type: application/json</text>
      <text x="578" y="289" fill="#e2e8f0">{</text>
      <text x="594" y="312" fill="#e2e8f0">"data": [{</text>
      <text x="610" y="335" fill="#e2e8f0">
        "id":
        <tspan fill="#fbcfe8">42</tspan>
        , "client_name":
        <tspan fill="#a7f3d0">"invoice"</tspan>
        ,
      </text>
      <text x="610" y="358" fill="#e2e8f0">
        "url":
        <tspan fill="#a7f3d0">"/api/v1/files/7/42/download"</tspan>
      </text>
      <text x="594" y="381" fill="#e2e8f0">}]</text>
      <text x="578" y="404" fill="#e2e8f0">}</text>
    </g>
    <rect x="44" y="461" width="1012" height="3" rx="1.5" fill="url(#accent)" />
    <g font-size="13" text-anchor="middle">
      <text x="147" y="498" fill="#c4bbff">JWT verified</text>
      <text x="359" y="498" fill="#fbcfe8">Membership checked</text>
      <text x="601" y="498" fill="#a5f3fc">Permission checked</text>
      <text x="886" y="498" fill="#a7f3d0">Query scoped to tenant 7</text>
      <path
        d="M230 493h20m-5-4 5 4-5 4M473 493h20m-5-4 5 4-5 4M723 493h20m-5-4 5 4-5 4"
        fill="none"
        stroke="#64748b"
      />
    </g>
    <text x="550" y="538" text-anchor="middle" fill="#94a3b8" font-size="12">
      auth · users · roles · permissions · tenants · files · audits · health
    </text>
  </g>
</svg>
